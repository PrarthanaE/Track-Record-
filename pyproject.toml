[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-pipeline"
version = "0.1.0"
description = "Rail telemetry ingestion and metric validation pipeline for CQCN"
authors = [{ name = "Saransh Pareek" }]
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pandera[polars]>=0.18.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "boto3>=1.34.0",
    "sagemaker>=2.200.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.90.0",
    "ruff>=0.1.5",
    "mypy>=1.7.0"
]
